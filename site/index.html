  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

4; background-image: radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 26px 26px; color: #E8ECF4; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 0 20px 80px\">\n\n  <!-- ============ HEADER ============ -->\n  <header style=\"width: 100%; max-width: 920px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0 18px; border-bottom: 1px solid rgba(255,255,255,0.07)\">\n    <div onclick=\"{{ onHome }}\" style=\"display: flex; align-items: center; gap: 10px; cursor: pointer\">\n      <div style=\"width: 30px; height: 30px; border-radius: 7px; background: #4ADE80; display: grid; place-items: center; color: #06210F; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 15px\">?<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column\">\n        <span style=\"font-weight: 700; font-size: 15px; letter-spacing: 0.02em\">AlgoPath<\u002Fspan>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #98A2B8; letter-spacing: 0.08em\">KACTL ROUTE FINDER<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display: flex; gap: 8px\">\n      <button onclick=\"{{ onBrowse }}\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #98A2B8; background: transparent; border: 1px solid rgba(255,255,255,0.12); border-radius: 7px; padding: 8px 14px; cursor: pointer\" style-hover=\"color: #E8ECF4; border-color: rgba(255,255,255,0.3)\">browse all<\u002Fbutton>\n      <button onclick=\"{{ onRestart }}\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #98A2B8; background: transparent; border: 1px solid rgba(255,255,255,0.12); border-radius: 7px; padding: 8px 14px; cursor: pointer\" style-hover=\"color: #E8ECF4; border-color: rgba(255,255,255,0.3)\">restart<\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- ============ START ============ -->\n  <sc-if value=\"{{ isStart }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 88px; animation: fadeUp .45s ease both\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #4ADE80; margin-bottom: 22px\">{{ stats }}<\u002Fdiv>\n      <h1 style=\"font-size: 52px; line-height: 1.08; font-weight: 700; margin: 0 0 20px; letter-spacing: -0.02em; text-wrap: balance\">Which algorithm should I&nbsp;use?<\u002Fh1>\n      <p style=\"font-size: 17px; line-height: 1.6; color: #98A2B8; max-width: 520px; margin: 0 0 40px; text-wrap: pretty\">Answer a short series of yes/no questions about your problem, and get routed to the right technique — with code, complexity, and the traps to avoid. Built on the KACTL contest reference.<\u002Fp>\n      <button onclick=\"{{ onStart }}\" style=\"display: flex; align-items: center; gap: 12px; background: #4ADE80; color: #06210F; border: none; border-radius: 10px; padding: 17px 34px; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 0 0 0 rgba(74,222,128,0.4); transition: transform .12s ease, box-shadow .2s ease\" style-hover=\"transform: translateY(-2px); box-shadow: 0 8px 30px -6px rgba(74,222,128,0.45)\">\n        Start\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">▸<\u002Fspan>\n      <\u002Fbutton>\n      <button onclick=\"{{ onBrowse }}\" style=\"margin-top: 18px; background: none; border: none; color: #98A2B8; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px\" style-hover=\"color: #E8ECF4\">or browse the full algorithm index →<\u002Fbutton>\n      <div style=\"margin-top: 72px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px\">\n        <sc-for list=\"{{ catChips }}\" as=\"chip\" hint-placeholder-count=\"8\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 5px 11px; border-radius: 99px; border: 1px solid {{ chip.border }}; color: {{ chip.color }}\">{{ chip.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ QUIZ ============ -->\n  <sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"width: 100%; max-width: 720px; padding-top: 40px; animation: fadeUp .3s ease both\">\n\n      <sc-if value=\"{{ hasCrumbs }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 34px; align-items: center\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #5B6472; letter-spacing: 0.1em; margin-right: 4px\">PATH<\u002Fspan>\n          <sc-for list=\"{{ crumbs }}\" as=\"crumb\" hint-placeholder-count=\"2\">\n            <button onclick=\"{{ crumb.onJump }}\" title=\"Jump back to this question\" style=\"display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B8; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 99px; padding: 4px 10px; cursor: pointer\" style-hover=\"border-color: rgba(255,255,255,0.3); color: #E8ECF4\">\n              <span style=\"width: 6px; height: 6px; border-radius: 99px; background: {{ crumb.color }}; flex: none\"><\u002Fspan>\n              {{ crumb.label }}\n              <span style=\"font-weight: 600; color: {{ crumb.ansColor }}\">{{ crumb.ans }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.14em; color: {{ catColor }}; margin-bottom: 14px\">QUESTION {{ qNum }} · {{ catLabel }}<\u002Fdiv>\n      <h2 data-screen-label=\"quiz question\" style=\"font-size: 36px; line-height: 1.2; font-weight: 700; margin: 0 0 22px; letter-spacing: -0.015em; min-height: 86px; text-wrap: balance\">{{ question }}<\u002Fh2>\n\n      <sc-if value=\"{{ showHints }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; gap: 12px; background: rgba(255,255,255,0.035); border: 1px dashed rgba(255,255,255,0.14); border-radius: 10px; padding: 15px 17px; margin-bottom: 34px\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4ADE80; flex: none; margin-top: 1px\">hint<\u002Fspan>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.6; color: #B6BFCE; text-wrap: pretty\">{{ hint }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 14px\">\n        <button onclick=\"{{ onYes }}\" style=\"display: flex; align-items: center; justify-content: space-between; background: rgba(74,222,128,0.09); border: 1px solid rgba(74,222,128,0.35); color: #4ADE80; border-radius: 12px; padding: 22px 22px; font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; cursor: pointer; transition: transform .1s ease, background .15s ease\" style-hover=\"background: rgba(74,222,128,0.18); transform: translateY(-2px)\">\n          Yes\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; border: 1px solid rgba(74,222,128,0.4); border-radius: 5px; padding: 3px 7px; opacity: 0.8\">Y<\u002Fspan>\n        <\u002Fbutton>\n        <button onclick=\"{{ onNo }}\" style=\"display: flex; align-items: center; justify-content: space-between; background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.3); color: #F87171; border-radius: 12px; padding: 22px 22px; font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; cursor: pointer; transition: transform .1s ease, background .15s ease\" style-hover=\"background: rgba(248,113,113,0.16); transform: translateY(-2px)\">\n          No\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; border: 1px solid rgba(248,113,113,0.4); border-radius: 5px; padding: 3px 7px; opacity: 0.8\">N<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; justify-content: space-between; margin-top: 26px\">\n        <sc-if value=\"{{ canBack }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ onBack }}\" style=\"background: none; border: none; color: #98A2B8; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer\" style-hover=\"color: #E8ECF4\">← back one question<\u002Fbutton>\n        <\u002Fsc-if>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5B6472\">keys: Y / N / ⌫<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ RESULT ============ -->\n  <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"result\" style=\"width: 100%; max-width: 780px; padding-top: 40px; animation: fadeUp .3s ease both\">\n\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.14em; color: #4ADE80; margin-bottom: 16px\">▸ USE THIS<\u002Fdiv>\n\n      <div style=\"background: #12161F; border: 1px solid rgba(255,255,255,0.08); border-top: 3px solid {{ algoCatColor }}; border-radius: 14px; padding: 30px 32px 32px; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6)\">\n\n        <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 99px; border: 1px solid {{ algoCatBorder }}; color: {{ algoCatColor }}\">{{ algoCatLabel }}<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,0.05); color: #98A2B8\">{{ algoComplexity }}<\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"font-size: 33px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.015em; line-height: 1.15\">{{ algoName }}<\u002Fh2>\n        <p style=\"font-size: 16px; color: #98A2B8; margin: 0 0 26px; line-height: 1.55\">{{ algoTag }}<\u002Fp>\n\n        <!-- code -->\n        <div style=\"border: 1px solid rgba(255,255,255,0.09); border-radius: 10px; overflow: hidden; margin-bottom: 26px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.04); padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.07)\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #98A2B8\">snippet.cpp<\u002Fspan>\n            <button onclick=\"{{ onCopy }}\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B8; background: transparent; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 4px 10px; cursor: pointer\" style-hover=\"color: #E8ECF4; border-color: rgba(255,255,255,0.35)\">{{ copyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background: #0A0D13; padding: 16px 18px; overflow-x: auto\">{{ codeEl }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 26px\">\n          <div>\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #4ADE80; margin-bottom: 12px\">WHEN TO USE<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <sc-for list=\"{{ whenList }}\" as=\"w\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; gap: 9px; font-size: 13.5px; line-height: 1.55; color: #C6CDDA\"><span style=\"color: #4ADE80; flex: none; font-family: 'JetBrains Mono', monospace\">✓<\u002Fspan><span>{{ w.t }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #F87171; margin-bottom: 12px\">WATCH OUT<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <sc-for list=\"{{ pitfallList }}\" as=\"w\" hint-placeholder-count=\"2\">\n                <div style=\"display: flex; gap: 9px; font-size: 13.5px; line-height: 1.55; color: #C6CDDA\"><span style=\"color: #F87171; flex: none; font-family: 'JetBrains Mono', monospace\">!<\u002Fspan><span>{{ w.t }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 28px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.07)\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #98A2B8; margin-bottom: 12px\">ALSO CONSIDER<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            <sc-for list=\"{{ altList }}\" as=\"alt\" hint-placeholder-count=\"2\">\n              <button onclick=\"{{ alt.onGo }}\" style=\"display: flex; align-items: baseline; gap: 7px; font-family: 'Space Grotesk', sans-serif; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.11); border-radius: 8px; padding: 8px 13px; cursor: pointer; text-align: left\" style-hover=\"border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.07)\">\n                <span style=\"font-size: 13px; font-weight: 600; color: #E8ECF4\">{{ alt.name }}<\u002Fspan>\n                <span style=\"font-size: 11.5px; color: #98A2B8\">{{ alt.note }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasCrumbs }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top: 26px\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #5B6472; letter-spacing: 0.1em; margin-bottom: 10px\">HOW YOU GOT HERE<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center\">\n            <sc-for list=\"{{ crumbs }}\" as=\"crumb\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ crumb.onJump }}\" title=\"Jump back to this question\" style=\"display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B8; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 99px; padding: 4px 10px; cursor: pointer\" style-hover=\"border-color: rgba(255,255,255,0.3); color: #E8ECF4\">\n                <span style=\"width: 6px; height: 6px; border-radius: 99px; background: {{ crumb.color }}; flex: none\"><\u002Fspan>\n                {{ crumb.label }}\n                <span style=\"font-weight: 600; color: {{ crumb.ansColor }}\">{{ crumb.ans }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display: flex; gap: 10px; margin-top: 30px\">\n        <button onclick=\"{{ onRestart }}\" style=\"background: #4ADE80; color: #06210F; border: none; border-radius: 9px; padding: 12px 22px; font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 700; cursor: pointer\" style-hover=\"filter: brightness(1.1)\">↺ Start over<\u002Fbutton>\n        <sc-if value=\"{{ canBack }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ onBack }}\" style=\"background: transparent; color: #98A2B8; border: 1px solid rgba(255,255,255,0.14); border-radius: 9px; padding: 12px 22px; font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 600; cursor: pointer\" style-hover=\"color: #E8ECF4; border-color: rgba(255,255,255,0.35)\">← Change last answer<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ BROWSE ============ -->\n  <sc-if value=\"{{ isBrowse }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"browse index\" style=\"width: 100%; max-width: 920px; padding-top: 40px; animation: fadeUp .3s ease both\">\n      <h2 style=\"font-size: 32px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.015em\">Algorithm index<\u002Fh2>\n      <p style=\"font-size: 15px; color: #98A2B8; margin: 0 0 36px\">Every destination in the decision tree. Click any card for code and notes.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 38px\">\n        <sc-for list=\"{{ browseCats }}\" as=\"cat\" hint-placeholder-count=\"4\">\n          <div>\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 14px\">\n              <span style=\"width: 9px; height: 9px; border-radius: 3px; background: {{ cat.color }}\"><\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: 0.12em; color: #E8ECF4; font-weight: 600\">{{ cat.label }}<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5B6472\">{{ cat.count }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px\">\n              <sc-for list=\"{{ cat.items }}\" as=\"item\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ item.onGo }}\" style=\"text-align: left; background: #12161F; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 15px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: transform .1s ease\" style-hover=\"border-color: {{ cat.color }}; transform: translateY(-2px)\">\n                  <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 600; color: #E8ECF4; line-height: 1.25\">{{ item.name }}<\u002Fspan>\n                  <span style=\"font-size: 12px; color: #98A2B8; line-height: 1.45\">{{ item.tag }}<\u002Fspan>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #5B6472\">{{ item.complexity }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1200, &quot;height&quot;: 800 },\n  &quot;showHints&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot; },\n  &quot;codeFontSize&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 13, &quot;min&quot;: 11, &quot;max&quot;: 17, &quot;step&quot;: 1, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Code display&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { mode: \"start\", nodeId: null, crumbs: [], leafId: null, copied: false, dataReady: false };\n\n  CATS = {\n    graph:  { label: \"GRAPHS\",          color: \"#A78BFA\" },\n    tree:   { label: \"TREES\",           color: \"#4ADE80\" },\n    string: { label: \"STRINGS\",         color: \"#FBBF24\" },\n    math:   { label: \"MATH\",            color: \"#60A5FA\" },\n    geo:    { label: \"GEOMETRY\",        color: \"#F472B6\" },\n    ds:     { label: \"DATA STRUCTURES\", color: \"#2DD4BF\" },\n    dp:     { label: \"DP\",              color: \"#FB923C\" },\n    misc:   { label: \"GENERAL TACTICS\", color: \"#94A3B8\" },\n  };\n\n  componentDidMount() {\n    const R = window.__resources || {};\n    Promise.all([\n      import(R.treeData || \"./data/tree.js\"),\n      import(R.algosGraph || \"./data/algos-graph.js\"),\n      import(R.algosSmg || \"./data/algos-smg.js\"),\n      import(R.algosDdm || \"./data/algos-ddm.js\"),\n    ]).then(([t, g, s, d]) => {\n      this.NODES = t.NODES;\n      this.ROOT = t.ROOT;\n      this.ALGOS = Object.assign({}, g.ALGOS_GRAPH, s.ALGOS_SMG, d.ALGOS_DDM);\n      let saved = null;\n      try { saved = JSON.parse(localStorage.getItem(\"algopath-state\")); } catch (e) {}\n      if (saved && saved.mode && (saved.mode === \"start\" || saved.mode === \"browse\" ||\n          (saved.mode === \"quiz\" && this.NODES[saved.nodeId]) ||\n          (saved.mode === \"result\" && this.ALGOS[saved.leafId]))) {\n        this.setState({ ...saved, copied: false, dataReady: true });\n      } else {\n        this.setState({ dataReady: true });\n      }\n    });\n    this.onKey = (e) => {\n      if (this.state.mode !== \"quiz\" || !this.dataOk()) return;\n      const k = e.key.toLowerCase();\n      if (k === \"y\") this.answer(true);\n      else if (k === \"n\") this.answer(false);\n      else if (k === \"backspace\") { e.preventDefault(); this.back(); }\n    };\n    window.addEventListener(\"keydown\", this.onKey);\n  }\n  componentWillUnmount() { window.removeEventListener(\"keydown\", this.onKey); }\n\n  dataOk() { return !!(this.NODES && this.ALGOS); }\n\n  save(next) {\n    this.setState(next, () => {\n      const { mode, nodeId, crumbs, leafId } = this.state;\n      try { localStorage.setItem(\"algopath-state\", JSON.stringify({ mode, nodeId, crumbs, leafId })); } catch (e) {}\n      window.scrollTo(0, 0);\n    });\n  }\n\n  start() { this.save({ mode: \"quiz\", nodeId: this.ROOT, crumbs: [], leafId: null }); }\n\n  answer(yes) {\n    const node = this.NODES[this.state.nodeId];\n    if (!node) return;\n    const dest = yes ? node.yes : node.no;\n    const crumbs = [...this.state.crumbs, { nodeId: this.state.nodeId, ans: yes }];\n    if (dest.startsWith(\"leaf:\")) {\n      this.save({ mode: \"result\", leafId: dest.slice(5), crumbs, copied: false });\n    } else {\n      this.save({ mode: \"quiz\", nodeId: dest, crumbs });\n    }\n  }\n\n  back() {\n    const crumbs = [...this.state.crumbs];\n    if (!crumbs.length) { this.save({ mode: \"start\", nodeId: null, crumbs: [], leafId: null }); return; }\n    const last = crumbs.pop();\n    this.save({ mode: \"quiz\", nodeId: last.nodeId, crumbs, leafId: null });\n  }\n\n  jumpTo(idx) {\n    const crumbs = this.state.crumbs.slice(0, idx);\n    this.save({ mode: \"quiz\", nodeId: this.state.crumbs[idx].nodeId, crumbs, leafId: null });\n  }\n\n  goLeaf(id) { this.save({ mode: \"result\", leafId: id, copied: false }); }\n\n  copyCode() {\n    const a = this.ALGOS && this.ALGOS[this.state.leafId];\n    if (!a) return;\n    navigator.clipboard.writeText(a.code).then(() => {\n      this.setState({ copied: true });\n      clearTimeout(this.copyT);\n      this.copyT = setTimeout(() => this.setState({ copied: false }), 1600);\n    });\n  }\n\n  // tiny C++ highlighter -> React elements\n  highlight(code, fontSize) {\n    const KW = /^(if|else|for|while|return|struct|const|auto|using|namespace|void|break|continue|switch|case|new|delete|template|typename|typedef|include|true|false|sizeof|this)$/;\n    const TY = /^(int|ll|ull|long|char|bool|double|float|string|vector|vi|pair|queue|priority_queue|set|map|array|deque|tree|Mat|P|Node|BIT|UF|Tree|Q|greater|null_type|less|size_t|unsigned)$/;\n    const out = [];\n    let key = 0;\n    const push = (text, color, style) => out.push(React.createElement(\"span\", { key: key++, style: Object.assign({ color }, style || {}) }, text));\n    const lines = code.split(\"\\n\");\n    lines.forEach((line, li) => {\n      let i = 0;\n      const cIdx = line.indexOf(\"//\");\n      let codePart = line, comment = null;\n      if (cIdx !== -1) { codePart = line.slice(0, cIdx); comment = line.slice(cIdx); }\n      const re = /(\"([^\"\\\\]|\\\\.)*\"|'([^'\\\\]|\\\\.)*'|[A-Za-z_][A-Za-z0-9_]*|\\d[\\dxXa-fA-F.eE]*|\\s+|.)/g;\n      let m;\n      while ((m = re.exec(codePart))) {\n        const t = m[0];\n        if (/^\\s+$/.test(t)) push(t, \"#C6CDDA\");\n        else if (t[0] === '\"' || t[0] === \"'\") push(t, \"#A5D6A7\");\n        else if (/^\\d/.test(t)) push(t, \"#F78C6C\");\n        else if (KW.test(t)) push(t, \"#C792EA\");\n        else if (TY.test(t)) push(t, \"#82AAFF\");\n        else if (/^[A-Za-z_]/.test(t)) push(t, \"#E8ECF4\");\n        else if (/^[#<>&|^!=+\\-*/%~?:]$/.test(t)) push(t, \"#89DDFF\");\n        else push(t, \"#C6CDDA\");\n      }\n      if (comment) push(comment, \"#6B7486\", { fontStyle: \"italic\" });\n      if (li < lines.length - 1) push(\"\\n\", \"#C6CDDA\");\n    });\n    return React.createElement(\"pre\", {\n      style: { margin: 0, fontFamily: \"'JetBrains Mono', monospace\", fontSize: fontSize + \"px\", lineHeight: 1.65, color: \"#C6CDDA\", whiteSpace: \"pre\", tabSize: 2 },\n    }, React.createElement(\"code\", null, out));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const ok = this.dataOk() && s.dataReady;\n    const CATS = this.CATS;\n    const showHints = this.props.showHints ?? true;\n    const codeFontSize = this.props.codeFontSize ?? 13;\n\n    const vals = {\n      isStart: s.mode === \"start\",\n      isQuiz: ok && s.mode === \"quiz\",\n      isResult: ok && s.mode === \"result\",\n      isBrowse: ok && s.mode === \"browse\",\n      showHints,\n      onStart: () => ok && this.start(),\n      onRestart: () => ok && this.start(),\n      onBrowse: () => ok && this.save({ mode: \"browse\" }),\n      onHome: () => this.save({ mode: \"start\", nodeId: null, crumbs: [], leafId: null }),\n      onBack: () => this.back(),\n      onYes: () => this.answer(true),\n      onNo: () => this.answer(false),\n      onCopy: () => this.copyCode(),\n      copyLabel: s.copied ? \"copied ✓\" : \"copy\",\n      canBack: s.crumbs.length > 0 || s.mode === \"quiz\",\n      hasCrumbs: s.crumbs.length > 0,\n      stats: \"58 DESTINATIONS · 85+ ALGORITHMS · YES/NO ALL THE WAY\",\n      catChips: Object.values(CATS).map((c) => ({ label: c.label.toLowerCase(), color: c.color, border: c.color + \"55\" })),\n      crumbs: [], question: \"\", hint: \"\", qNum: \"\", catLabel: \"\", catColor: \"#4ADE80\",\n      algoName: \"\", algoTag: \"\", algoComplexity: \"\", algoCatLabel: \"\", algoCatColor: \"#4ADE80\", algoCatBorder: \"#4ADE8055\",\n      codeEl: null, whenList: [], pitfallList: [], altList: [], browseCats: [],\n    };\n    if (!ok) return vals;\n\n    vals.crumbs = s.crumbs.map((c, i) => {\n      const n = this.NODES[c.nodeId];\n      return {\n        label: n ? n.short : \"?\",\n        ans: c.ans ? \"Y\" : \"N\",\n        ansColor: c.ans ? \"#4ADE80\" : \"#F87171\",\n        color: n ? CATS[n.cat].color : \"#94A3B8\",\n        onJump: () => this.jumpTo(i),\n      };\n    });\n\n    if (s.mode === \"quiz\") {\n      const node = this.NODES[s.nodeId];\n      if (node) {\n        vals.question = node.q;\n        vals.hint = node.hint;\n        vals.qNum = String(s.crumbs.length + 1).padStart(2, \"0\");\n        vals.catLabel = CATS[node.cat].label;\n        vals.catColor = CATS[node.cat].color;\n      }\n    }\n\n    if (s.mode === \"result\") {\n      const a = this.ALGOS[s.leafId];\n      if (a) {\n        vals.algoName = a.name;\n        vals.algoTag = a.tag;\n        vals.algoComplexity = a.complexity;\n        vals.algoCatLabel = CATS[a.cat].label;\n        vals.algoCatColor = CATS[a.cat].color;\n        vals.algoCatBorder = CATS[a.cat].color + \"55\";\n        vals.codeEl = this.highlight(a.code, codeFontSize);\n        vals.whenList = a.when.map((t) => ({ t }));\n        vals.pitfallList = a.pitfalls.map((t) => ({ t }));\n        vals.altList = a.alt.map((al) => ({\n          name: al.name, note: al.note,\n          onGo: () => al.id && this.ALGOS[al.id] ? this.goLeaf(al.id) : null,\n        }));\n      }\n    }\n\n    if (s.mode === \"browse\") {\n      const order = [\"graph\", \"tree\", \"ds\", \"dp\", \"string\", \"math\", \"geo\", \"misc\"];\n      vals.browseCats = order.map((cat) => {\n        const items = Object.entries(this.ALGOS)\n          .filter(([, a]) => a.cat === cat)\n          .map(([id, a]) => ({ name: a.name, tag: a.tag, complexity: a.complexity, onGo: () => this.goLeaf(id) }));\n        return { label: CATS[cat].label, color: CATS[cat].color, count: items.length + \" ITEMS\", items };\n      });\n    }\n\n    return vals;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
